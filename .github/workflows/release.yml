name: Build, publish & deploy

on:
  # Build dan deploy main hanya setelah seluruh job pada workflow CI sukses.
  workflow_run:
    workflows: [CI]
    types: [completed]
  # Tag rilis tetap dapat menghasilkan image versi tanpa men-deploy production.
  push:
    tags: ['v*']
  # Memungkinkan redeploy manual dari halaman Actions.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    # workflow_run juga terjadi untuk pull request dan CI yang gagal. Keduanya
    # tidak boleh menerbitkan image production.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend

    steps:
      - name: Checkout commit yang lulus CI
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      # GHCR hanya menerima nama repository huruf kecil, sedangkan pemilik repo
      # ini mengandung huruf kapital (VaniaSaleletang07).
      - name: Normalkan nama owner
        id: owner
        shell: bash
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Susun tag image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/prima-${{ matrix.name }}
          # Tag SHA bersifat immutable dan dipakai saat deploy/rollback.
          # "latest" hanya diperbarui untuk main atau redeploy manual.
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch' }}
            type=raw,value=sha-${{ env.SOURCE_SHA }}
            type=ref,event=tag

      - name: Build dan push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy production
    needs: build
    # Tag hanya dipublish. Push main yang lulus CI dan dispatch manual dideploy.
    if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validasi konfigurasi deployment
        shell: bash
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.PROD_DEPLOY_PATH }}
        run: |
          test -n "$SSH_HOST" || { echo "Secret PROD_SSH_HOST belum diisi"; exit 1; }
          test -n "$SSH_USER" || { echo "Secret PROD_SSH_USER belum diisi"; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "Secret PROD_SSH_PRIVATE_KEY belum diisi"; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "Secret PROD_SSH_KNOWN_HOSTS belum diisi"; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "Variable PROD_DEPLOY_PATH belum diisi"; exit 1; }

      - name: Siapkan SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sinkronkan dan jalankan versi baru
        shell: bash
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          DEPLOY_PATH: ${{ vars.PROD_DEPLOY_PATH }}
          IMAGE_TAG: sha-${{ env.SOURCE_SHA }}
        run: |
          SSH_PORT="${SSH_PORT:-22}"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'sh -se' -- "$DEPLOY_PATH" "$IMAGE_TAG" <<'REMOTE'
          deploy_path="$1"
          image_tag="$2"

          cd "$deploy_path"
          git pull --ff-only origin main
          export PRIMA_IMAGE_TAG="$image_tag"
          docker compose -f compose.yaml -f compose.production.yaml pull
          docker compose -f compose.yaml -f compose.production.yaml up -d --remove-orphans
          docker compose -f compose.yaml -f compose.production.yaml ps
          REMOTE
